<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20252b">
  <title>NKH Dashboard · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f5f6;color:#20252b;font-family:Arial,sans-serif}.card{width:min(420px,100%);padding:30px;border:1px solid #e3e6e8;border-radius:20px;background:#fff;box-shadow:0 18px 45px rgba(32,37,43,.12)}.brand{display:flex;align-items:baseline;gap:8px;font-weight:900}.brand b{font-size:28px}.brand span{color:#e98a15}h1{margin:28px 0 8px;font-size:24px}p{margin:0;color:#707984;line-height:1.55}button{width:100%;min-height:46px;margin-top:24px;border:0;border-radius:11px;background:#e98a15;color:#fff;font-weight:900}
  </style>
</head>
<body><main class="card"><div class="brand"><b>NKH</b><span>Dashboard</span></div><h1>You’re offline</h1><p>Previously loaded screens remain available, but tasks, inboxes, roster and client data need an internet connection.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
